name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure .env exists (required by pubspec asset)
        run: echo "PLACEHOLDER=test" > .env

      - name: Generate drift code (app_database.g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify ink_sparkle shader asset
        run: |
          test -f assets/shaders/ink_sparkle.frag || (echo "::error::ink_sparkle.frag missing" && exit 1)
          grep -q "shaders:" pubspec.yaml || (echo "::error::pubspec.yaml missing shaders:" && exit 1)

      - name: Static analysis
        run: flutter analyze

      - name: Cross-feature import check
        run: python scripts/check_cross_feature.py --ci

      - name: Run tests
        run: flutter test

  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify layer purity (domain/data/presentation 4-layer)
        run: dart scripts/check_all.dart
