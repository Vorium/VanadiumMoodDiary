name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure .env exists (required by pubspec asset)
        run: echo "PLACEHOLDER=test" > .env

      - name: Generate drift code (app_database.g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify ink_sparkle shader asset
        run: |
          test -f assets/shaders/ink_sparkle.frag || (echo "::error::ink_sparkle.frag missing" && exit 1)
          grep -q "shaders:" pubspec.yaml || (echo "::error::pubspec.yaml missing shaders:" && exit 1)

      # v0.27 round 67 (E10.3 / C1.5 护栏): dart format 阻断
      # 之前 R66 uncommitted 漏跑 dart format, 133 文件 unformatted
      # 加这道护栏避免下次重蹈覆辙
      - name: Verify dart format
        run: dart format --output=none --set-exit-if-changed lib/ test/ scripts/

      - name: Static analysis
        run: flutter analyze

      - name: Cross-feature import check
        run: python scripts/check_cross_feature.py --ci

      - name: ARB key bidirectional check
        run: python scripts/check_arb_keys.py

      - name: ARB key orphan check
        run: python scripts/check_orphan_arb_keys.py

      - name: zh-Hant consistency check
        run: python scripts/check_zh_hant_consistency.py

      - name: Drift namespace check
        run: python scripts/check_drift_namespace.py --strict

      - name: DateTime race check (race2: >=2 DateTime.now() in same function)
        run: python scripts/check_datetime_race2.py

      - name: DateTime race check (race: multi-capture in same call site)
        run: python scripts/check_datetime_race.py

      - name: Fullwidth punctuation check
        run: python scripts/check_fullwidth_punctuation.py --ci

      - name: UTC hardcoded check
        run: python scripts/check_no_hardcoded_utc.py

      - name: PUA character check
        run: python scripts/check_no_pua.py

      - name: Widget dispose check (resource leak)
        run: python scripts/check_widget_dispose.py

      - name: Legal consent TODO check
        run: python scripts/check_legal_consent.py

      - name: Hardcoded strings (with i18n override) check
        run: python scripts/check_strings_hardcoded.py

      - name: CHANGELOG / pubspec version order check
        run: python scripts/check_changelog.py

      - name: 16KB page size alignment check (Google Play 2025-11)
        run: python scripts/check_16kb_alignment.py

      - name: Run tests
        run: flutter test

  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify layer purity (domain/data/presentation 4-layer)
        run: dart scripts/check_all.dart

  build:
    # v0.22 round 31 (sp-en P0-2): 加 release build job
    # 之前 CI 只跑 flutter analyze + test,**从不跑 build apk/web**。
    # dev 模式能跑 ≠ release 模式能 build 成功（minify / R8 / shader 编译 / aot 都有可能炸）。
    # 这是 `superpowers:verification-before-completion` 在 release 模式的硬性要求。
    name: Flutter build (apk + web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure .env exists (required by pubspec asset)
        run: echo "PLACEHOLDER=test" > .env

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug, fastest signal)
        run: flutter build apk --debug

      - name: Build Web (production)
        run: flutter build web --release
