# pubspec_overrides.yaml — 用于解决 objective_c-9.4.1 与本机 Dart SDK (3.11.5) 的兼容性问题
# 9.4.1 的预编译 kernel 二进制用更新的 SDK 编译（version 130），本机 SDK 只认 127
# 暂时锁到 9.3.0，等 Dart SDK 升级或 objective_c 修复后移除
dependency_overrides:
  objective_c: 9.3.0
  # record_linux 0.7.2 未实现 record_platform_interface 的 startStream / hasPermission(request:),
  # 即使 1.5.0 也有此方法。直接升 record_linux 到 1.3.1 (仅影响 Linux desktop, Android 不受影响)
  record_linux: 1.3.1
  # v0.30 R108 revisit: drift_dev 2.34.0 + sqlparser 0.44.6 (latest) 不兼容
  # (新版 0.44.6 改 sealed class DartPlaceholder, 删了 when 方法,
  #  drift_dev 2.34.0 query_analyzer.dart:761 还在用 placeholder.when)
  # 锁到 0.44.5 (上一个 0.44.x 还在用 class DartPlaceholder + when) 解开
  sqlparser: 0.44.5
