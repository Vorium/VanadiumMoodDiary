name: chroniccare
# v0.27 R69: 双语描述, App Store / Google Play en 模式 UX 一致
# 1.1.0 round 6d: 改情绪优先定位 (情绪日记 + 树洞倾诉优先, 用药记录辅助, 对齐 README)
description: "情绪日记 + 树洞倾诉优先 — ChronicCare: mood journal & vent-first self-care app for mental wellness, with medication tracking as support"
publish_to: 'none'
version: 1.1.0+179

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.2

  # 本地数据库
  drift: ^2.20.3
  # v0.27 round 82: 0.6.5+ 是 16KB page size 对齐最低版本 (Google Play 2025-11 强制)
  # 当前 locked 0.6.8 (>= 0.6.5) 已满足; 0.7.0 是 eol 不升级
  sqlcipher_flutter_libs: ^0.6.5
  path_provider: ^2.1.4
  path: ^1.9.0

  # 加密
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1

  # 路由
  go_router: ^14.6.1

  # 通知
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # 趋势图
  fl_chart: ^0.69.0

  # PDF 报告
  pdf: ^3.11.1
  printing: ^5.13.4

  # 国际化
  intl: ^0.20.2

  # 工具
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  # R97-P1-11 (2026-08-07): 危机热线一键拨打 tel: intent。
  # 之前 crisis_hotline_page 只能复制号码, 危机时刻用户要多步操作 (打开拨号
  # App + 粘贴 + 拨打), 违反 Google Play Health/Sensitive Apps policy 推荐
  # "一键拨打危机热线"。加 url_launcher 后, tel: scheme 走系统拨号 App
  # (Android Intent.ACTION_DIAL + iOS openURL:), 不需要 CALL_PHONE 权限。
  url_launcher: ^6.3.1

  # 录音（树洞 audio）
  record: ^5.2.0
  audioplayers: ^6.1.0

  # v0.23 (Round 31 in development) 情绪日记语音录入 — 本地 STT
  # 7.x: mobile 走平台 on-device / cloud STT, web 走 Chrome Web Speech API
  # 注意: version 已 0.23.0+1 (v0.24 release 时一起升)
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # v0.32 round 8 (FS P2-005): 显式声明 — vent_detail_page_round7b_test
  # 直接 import audioplayers_platform_interface 触发
  # depend_on_referenced_packages info (它只是 audioplayers 的传递依赖)。
  # 用 dev 声明 (只测试 mock 平台通道用), 保持 runtime 依赖面不变。
  audioplayers_platform_interface: ^7.1.0

  # R113 (BUG 3): 显式声明 — notification_initializer_round113_test 直接
  # import flutter_local_notifications_platform_interface (替换
  # FlutterLocalNotificationsPlatform.instance 为 fake 平台实现, 测试
  # requestPermission 平台分支)。同 audioplayers_platform_interface 模式。
  flutter_local_notifications_platform_interface: ^7.2.0

  # 代码生成
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - assets/shaders/ink_sparkle.frag
  assets:
    - assets/icons/
    - assets/legal/user_agreement.md
    - assets/legal/privacy_policy.md
    - assets/legal/sensitive_data_consent.md
    - assets/legal/medical_disclaimer.md
dependency_overrides:
  # v0.30 R108 revisit: drift_dev 2.34.0 + sqlparser 0.44.6 (latest) 不兼容
  # (新版 0.44.6 改 sealed class DartPlaceholder, 删了 when 方法,
  #  drift_dev 2.34.0 query_analyzer.dart:761 还在用 placeholder.when)
  # 锁到 0.44.5 (上一个 0.44.x 还在用 class DartPlaceholder + when) 解开
  sqlparser: 0.44.5
