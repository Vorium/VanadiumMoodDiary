name: chroniccare
description: "我今天吃了药 - 精神心理患者吃药打卡 + 停药通知"
publish_to: 'none'
version: 0.22.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.2

  # 本地数据库
  drift: ^2.20.3
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # 加密
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1

  # 路由
  go_router: ^14.6.1

  # 通知
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # 趋势图
  fl_chart: ^0.69.0

  # PDF 报告
  pdf: ^3.11.1
  printing: ^5.13.4

  # 国际化
  intl: ^0.20.2

  # 工具
  uuid: ^4.5.1
  flutter_dotenv: ^6.0.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3

  # 录音（树洞 audio）
  record: ^5.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - assets/shaders/ink_sparkle.frag
  assets:
    - assets/icons/
    - assets/legal/user_agreement.md
    - assets/legal/privacy_policy.md
    - assets/legal/sensitive_data_consent.md
    - .env
