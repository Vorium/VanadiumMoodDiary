name: chroniccare
# v0.27 R69: 双语描述, App Store / Google Play en 模式 UX 一致
description: "我今天吃了药 - ChronicCare: medication reminder & mood tracker for people managing chronic conditions"
publish_to: 'none'
version: 0.32.0+113

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.2

  # 本地数据库
  drift: ^2.20.3
  # v0.27 round 82: 0.6.5+ 是 16KB page size 对齐最低版本 (Google Play 2025-11 强制)
  # 当前 locked 0.6.8 (>= 0.6.5) 已满足; 0.7.0 是 eol 不升级
  sqlcipher_flutter_libs: ^0.6.5
  path_provider: ^2.1.4
  path: ^1.9.0

  # 加密
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1

  # 路由
  go_router: ^14.6.1

  # 通知
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # 趋势图
  fl_chart: ^0.69.0

  # PDF 报告
  pdf: ^3.11.1
  printing: ^5.13.4

  # 国际化
  intl: ^0.20.2

  # 工具
  uuid: ^4.5.1
  flutter_dotenv: ^6.0.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  # R97-P1-11 (2026-08-07): 危机热线一键拨打 tel: intent。
  # 之前 crisis_hotline_page 只能复制号码, 危机时刻用户要多步操作 (打开拨号
  # App + 粘贴 + 拨打), 违反 Google Play Health/Sensitive Apps policy 推荐
  # "一键拨打危机热线"。加 url_launcher 后, tel: scheme 走系统拨号 App
  # (Android Intent.ACTION_DIAL + iOS openURL:), 不需要 CALL_PHONE 权限。
  url_launcher: ^6.3.1

  # 录音（树洞 audio）
  record: ^5.2.0
  audioplayers: ^6.1.0

  # v0.27 round 65 (appstore P0-4 IAP 集成)
  # Apple App Store 3.1.5 (a) 强制数字商品/服务走 IAP
  # 8 元一次性买断 → NonConsumablePurchase (非订阅)
  # 当前 dev 模式走 kDebugMode 直接返 true,productId 留 v0.28 真接
  in_app_purchase: ^3.3.0

  # v0.23 (Round 31 in development) 情绪日记语音录入 — 本地 STT
  # 7.x: mobile 走平台 on-device / cloud STT, web 走 Chrome Web Speech API
  # 注意: version 已 0.23.0+1 (v0.24 release 时一起升)
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - assets/shaders/ink_sparkle.frag
  assets:
    - assets/icons/
    - assets/legal/user_agreement.md
    - assets/legal/privacy_policy.md
    - assets/legal/sensitive_data_consent.md
    - assets/legal/medical_disclaimer.md
dependency_overrides:
  # v0.30 R108 revisit: drift_dev 2.34.0 + sqlparser 0.44.6 (latest) 不兼容
  # (新版 0.44.6 改 sealed class DartPlaceholder, 删了 when 方法,
  #  drift_dev 2.34.0 query_analyzer.dart:761 还在用 placeholder.when)
  # 锁到 0.44.5 (上一个 0.44.x 还在用 class DartPlaceholder + when) 解开
  sqlparser: 0.44.5
