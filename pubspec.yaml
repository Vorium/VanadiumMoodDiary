name: chroniccare
description: "我今天吃了药 - 精神心理患者吃药打卡 + 停药通知"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 数据类
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 本地数据库
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # 加密
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # 网络
  dio: ^5.7.0

  # 路由
  go_router: ^14.6.1

  # 通知
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1

  # 国际化
  intl: ^0.20.2

  # 工具
  uuid: ^4.5.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - .env
